pe&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;line1&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;가격 그대로, *밝기만* 두 배 가까이&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;leftName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;1 Pro&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;rightName&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;1 Pro+&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;rows&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;밝기|700니트|1200니트 / 2D→3D 변환|30fps|60fps / 가격|$599|$599&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;highlight&quot;: {&quot;editor&quot;: &quot;float&quot;, &quot;default&quot;: 0, &quot;min&quot;: 0, &quot;max&quot;: 3, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;badge&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;+71%&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;bodySubs&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;엑스리얼 *1 프로 플러스* / 밝기 700에서 *1200니트* / 가격은 *599달러* 그대로&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;중반부&quot;}, &quot;outroLine1&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;가격 안 올린 업그레이드,&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;마지막&quot;}, &quot;outroLine2&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;*갈아탈* 만할까?&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;마지막&quot;}, &quot;ctaText&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;팔로우하고 다음 소식 받기&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;마지막&quot;}, &quot;motionEditor&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;보기&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const d = {
          "layout": "specs",
          "accent": "#3D8BFF",
          "transition": "셔터",
          "platform": "인스타그램",
          "handle": "@channel",
          "videoSrc": "",
          "videoStart": 0,
          "videoFit": "채우기",
          "sound": false,
          "kicker": "XREAL · 2026",
          "line1": "가격 그대로, *밝기만* 두 배 가까이",
          "leftName": "1 Pro",
          "rightName": "1 Pro+",
          "rows": "밝기|700니트|1200니트 / 2D→3D 변환|30fps|60fps / 가격|$599|$599",
          "highlight": 0,
          "badge": "+71%",
          "bodySubs": "엑스리얼 *1 프로 플러스* / 밝기 700에서 *1200니트* / 가격은 *599달러* 그대로",
          "outroLine1": "가격 안 올린 업그레이드,",
          "outroLine2": "*갈아탈* 만할까?",
          "ctaText": "팔로우하고 다음 소식 받기"
    };
    const P = {};
    for (const k in d) P[k] = this.props[k] ?? d[k];
    P.layout = d.layout;
    P.videoFit = P.videoFit === '맞추기' ? 'fit' : 'cover';
    P.platform = { '유튜브': 'youtube', '숨김': 'none' }[P.platform] || 'instagram';
    P.transition = { '셔터': 'shutter', '줌 펀치': 'zoom', '없음': 'none' }[P.transition] || 'slash';
    return { pieceProps: P };
  }
}
</script>
