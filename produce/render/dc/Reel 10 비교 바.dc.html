ype&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;line1&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;신형 워크맨 3종, *가격* 한눈에&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;items&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;ZX900|1,899 / WM1AM3|2,999 / WM1ZM3|5,899&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;unit&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;$&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;unitPos&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;prefix&quot;, &quot;suffix&quot;], &quot;default&quot;: &quot;prefix&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;highlight&quot;: {&quot;editor&quot;: &quot;float&quot;, &quot;default&quot;: 2, &quot;min&quot;: 0, &quot;max&quot;: 4, &quot;step&quot;: 1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;도입부&quot;}, &quot;bodySubs&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;막내 ZX900 *1,899달러* / 가운데 WM1AM3 *2,999달러* / 금도금 WM1ZM3 *5,899달러*&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;중반부&quot;}, &quot;outroLine1&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;셋 중 하나 고른다면&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;마지막&quot;}, &quot;outroLine2&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;*어떤 거*?&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;마지막&quot;}, &quot;ctaText&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;팔로우하고 다음 소식 받기&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;마지막&quot;}, &quot;motionEditor&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;보기&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const d = {
          "layout": "rank",
          "accent": "#FF5A36",
          "transition": "셔터",
          "platform": "인스타그램",
          "handle": "@channel",
          "videoSrc": "",
          "videoStart": 0,
          "videoFit": "채우기",
          "sound": false,
          "kicker": "소니 워크맨 · 2026",
          "line1": "신형 워크맨 3종, *가격* 한눈에",
          "items": "ZX900|1,899 / WM1AM3|2,999 / WM1ZM3|5,899",
          "unit": "$",
          "unitPos": "prefix",
          "highlight": 2,
          "bodySubs": "막내 ZX900 *1,899달러* / 가운데 WM1AM3 *2,999달러* / 금도금 WM1ZM3 *5,899달러*",
          "outroLine1": "셋 중 하나 고른다면",
          "outroLine2": "*어떤 거*?",
          "ctaText": "팔로우하고 다음 소식 받기"
    };
    const P = {};
    for (const k in d) P[k] = this.props[k] ?? d[k];
    P.layout = d.layout;
    P.videoFit = P.videoFit === '맞추기' ? 'fit' : 'cover';
    P.platform = { '유튜브': 'youtube', '숨김': 'none' }[P.platform] || 'instagram';
    P.transition = { '셔터': 'shutter', '줌 펀치': 'zoom', '없음': 'none' }[P.transition] || 'slash';
    return { pieceProps: P };
  }
}
</script>
